<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTV Play Studio</title><link rel="stylesheet" href="/studio/styles.css"></head><body><header><a href="/">BTV <b>PLAY</b></a><span>Studio Editorial</span><button id="logout" hidden>Sair</button></header><main><section id="loginPanel" class="panel"><h1>Entrar no Studio</h1><p>Área reservada à equipa editorial.</p><form id="login"><label>Correio electrónico<input name="email" type="email" required></label><label>Palavra-passe<input name="password" type="password" required></label><button class="primary">Entrar</button></form></section><section id="workspace" hidden><div class="heading"><div><h1>Biblioteca de conteúdos</h1><p>Gerir e publicar os conteúdos da BTV</p></div><button class="primary" id="new">+ Novo conteúdo</button></div><div class="filters"><input id="search" placeholder="Pesquisar"><select id="status"><option value="">Todos os estados</option><option value="published">Publicados</option><option value="draft">Rascunhos</option></select></div><div id="list"></div></section></main><dialog id="editor"><form id="contentForm"><div class="heading"><h2 id="editTitle">Novo conteúdo</h2><button id="cancel" type="button">Fechar</button></div><div class="fields"><label>Título<input name="title" required maxlength="180"></label><label>Tipo<select name="kind"><option value="video">Vídeo</option><option value="episode">Episódio</option><option value="live">Em directo</option></select></label><label>Categoria<select name="category"><option>Notícias</option><option>Entrevistas</option><option>Documentários</option><option>Entretenimento</option><option>Economia</option><option>Desporto</option><option>Cultura</option><option>Sociedade</option><option>Debate</option></select></label><label>Programa<input name="program"></label><label>Temporada<input name="season" type="number" min="1"></label><label>Episódio<input name="episode" type="number" min="1"></label><label class="wide">Descrição<textarea name="description" rows="3"></textarea></label><label class="wide">URL do vídeo<input name="video_url" type="url"></label><label class="wide">Ou carregar vídeo até 100 MB<input type="file" name="videoFile" accept="video/*"></label><label class="wide">URL da capa<input name="thumbnail_url" type="url"></label><label class="wide">Ou carregar capa<input type="file" name="thumbnailFile" accept="image/jpeg,image/png,image/webp"></label><label>Estado<select name="status"><option value="draft">Rascunho</option><option value="published">Publicado</option></select></label><label class="check"><input type="checkbox" name="featured"> Destaque</label><label>Ordem<input name="sort_order" type="number" value="0"></label></div><button id="save" type="submit" class="primary">Guardar conteúdo</button></form></dialog><div id="toast" role="status"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/config.js"></script><script src="/studio/studio.js"></script></body></html>
