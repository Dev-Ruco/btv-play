server { listen 80; server_name _; root /usr/share/nginx/html; index index.html; charset utf-8; location = /health { return 200 'ok'; } location = /config.js { add_header Cache-Control 'no-store' always; } location / { try_files $uri $uri/ =404; } location /studio/ { try_files $uri $uri/ =404; } add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; }