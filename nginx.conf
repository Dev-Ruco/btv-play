server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  location = /health { return 200 'ok'; }
  location = /config.js { add_header Cache-Control 'no-store' always; }
  location = /area-editorial-7f29c4 { return 301 /area-editorial-7f29c4/; }
  location = /area-editorial-7f29c4/ {
    try_files /studio/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
  }
  location = /studio { return 404; }
  location = /studio/ { return 404; }
  location = /studio/index.html { return 404; }
  location = /studio/studio.js { try_files $uri =404; }
  location = /studio/styles.css { try_files $uri =404; }
  location ^~ /studio/ { return 404; }
  location / { try_files $uri $uri/ =404; }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
}
